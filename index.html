<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Test - Student Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="card">
    <h1>MCQ Test</h1>

    <!-- EDIT NOTICE TEXT BELOW (supports any language: Bengali, English, etc.) -->
    <div class="notice-board">
      <h3>Notice</h3>
      <p id="noticeText">এই পরীক্ষার সময়সীমা ১০ মিনিট। একবার সেরে ফেললে ফিরে যাওয়া যাবে না। / Exam duration is 10 minutes. Once submitted, you cannot go back.</p>
    </div>

    <p>Enter your details to start the exam.</p>
    <form id="studentForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <button type="submit" class="btn btn-primary" id="startBtn">Start Exam</button>
    </form>
    <div class="hint">Once started, you cannot go back to previous questions.</div>
  </div>
</div>
<script src="index.js"></script>
</body>
</html>
